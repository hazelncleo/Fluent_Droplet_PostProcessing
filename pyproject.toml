[project]
name = "fluent-droplet-postprocessing"
description = "Postprocessor for fluent results from the PALM project using pyensight and pyfluent."
readme = "README.md"
version = "0.1.0"
requires-python = "==3.13.1"
dependencies = [
    "ansys-pyensight-core>=0.11.2",
    "celluloid>=0.2.0",
    "inquirer>=3.4.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "pandas>=3.0.0",
    "scikit-image>=0.26.0",
    "scipy>=1.17.0",
    "seaborn>=0.13.2",
]
